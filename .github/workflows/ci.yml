name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Run by hand from the Actions tab, on any branch, for the full browser matrix.
  workflow_dispatch:
  # A weekly desktop WebKit run on main (the browsers below explain why PRs skip it).
  schedule:
    - cron: "23 3 * * 1"

permissions:
  contents: read

# One run per branch and trigger: a new push cancels the one before it, and a scheduled or manual
# run is never cancelled by a push.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

# Build minutes are the budget here, so this workflow spends them where they catch the most:
#
# - `static` runs format, lint, typecheck and boundaries in ONE job. Each job pays for its own
#   checkout and install, and bills whole minutes, so four short jobs cost more than one.
# - Docs-only changes (docs/ and *.md), on a pull request or a push to main, run only the format
#   check.
# - `test` and `build` wait for `static`, and the browser tests wait for `static` and `test`, so a
#   push that fails lint or a unit test does not also pay for the slow end-to-end run.
# - The browser tests (the bulk of the cost) run one browser per trigger:
#     pull request      chromium         (fast feedback while a change is open)
#     push to main      Mobile Safari    (the WebKit engine at a phone size: the real target)
#     weekly schedule   webkit           (desktop Safari)
#     manual            all three
#   Chromium on the PR catches nearly everything. WebKit problems show up after the merge, on main.
# - Git LFS (the audio fixtures) is fetched only by `test`, the one job that reads them.
#
# The `check` and `e2e` jobs at the bottom aggregate the results so the required status check
# names stay stable. A skipped job counts as passing, a failed or cancelled one does not.
jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      code: ${{ steps.plan.outputs.code }}
      projects: ${{ steps.plan.outputs.projects }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Plan
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          code=true
          if [ "$EVENT" = "pull_request" ] || [ "$EVENT" = "push" ]; then
            base="$PR_BASE_SHA"
            if [ "$EVENT" = "push" ]; then
              base="$PUSH_BEFORE_SHA"
            fi
            # If the base cannot be fetched (a new branch has an all-zero "before"), assume code.
            if git fetch --no-tags --depth=1 origin "$base" 2>/dev/null; then
              # Anything outside docs/ and Markdown files is code. No changes at all counts as docs.
              if ! git diff --name-only "$base" HEAD | grep -qvE '^(docs/|.*\.md$)'; then
                code=false
              fi
            fi
          fi
          case "$EVENT" in
            pull_request) projects='["chromium"]' ;;
            push) projects='["Mobile Safari"]' ;;
            schedule) projects='["webkit"]' ;;
            *) projects='["chromium","webkit","Mobile Safari"]' ;;
          esac
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "projects=$projects" >> "$GITHUB_OUTPUT"
          echo "code=$code projects=$projects"
      - uses: ./.github/actions/setup
      - run: pnpm format:check
      - if: steps.plan.outputs.code == 'true'
        run: pnpm lint
      - if: steps.plan.outputs.code == 'true'
        run: pnpm typecheck
      - if: steps.plan.outputs.code == 'true'
        run: pnpm boundaries

  test:
    needs: static
    if: needs.static.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          lfs: true
      - uses: ./.github/actions/setup
      - run: pnpm test

  build:
    needs: static
    if: needs.static.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup
      - run: pnpm --filter @clavis/web build
      # Check the notation (Verovio) chunk against its baseline.
      - run: pnpm --filter @clavis/web notation-size

  e2e-shard:
    name: e2e (${{ matrix.project }} ${{ matrix.shard }}/2)
    needs: [static, test]
    if: needs.static.outputs.code == 'true'
    runs-on: ubuntu-latest
    # Real-time session and offline specs; each job runs one browser project and half its specs.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(needs.static.outputs.projects) }}
        shard: [1, 2]
    env:
      # Mobile Safari is the WebKit engine with a phone-sized viewport, so it needs WebKit.
      BROWSER: ${{ matrix.project == 'chromium' && 'chromium' || 'webkit' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ env.BROWSER }}-${{ hashFiles('pnpm-lock.yaml') }}
      # With a warm cache this skips the browser download but still installs the system packages.
      - run: pnpm --filter @clavis/web exec playwright install --with-deps "$BROWSER"
      - run: >-
          pnpm --filter @clavis/web exec playwright test
          --project="${{ matrix.project }}" --shard=${{ matrix.shard }}/2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: playwright-report-${{ env.BROWSER }}-${{ strategy.job-index }}
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7

  # Aggregate jobs: branch protection requires these names.
  check:
    if: always()
    needs: [static, test, build]
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo '${{ toJSON(needs) }}'
          [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "false" ]

  e2e:
    if: always()
    needs: [static, e2e-shard]
    runs-on: ubuntu-latest
    steps:
      # Skipped is fine: either the change was docs only, or `static` or `test` failed, which
      # `check` already reports.
      - run: |
          echo '${{ toJSON(needs) }}'
          [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "false" ]
