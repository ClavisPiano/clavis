name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The steps of `pnpm check` run as separate parallel jobs. Keep them in sync with the "check"
# script in package.json. The `check` and `e2e` jobs at the bottom aggregate the results so the
# required status check names stay stable.
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm format:check

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm lint

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm typecheck

  boundaries:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm boundaries

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - uses: ./.github/actions/setup
      - run: pnpm test

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - uses: ./.github/actions/setup
      - run: pnpm --filter @clavis/web build
      # Check the notation (Verovio) chunk against its baseline.
      - run: pnpm --filter @clavis/web notation-size

  e2e-shard:
    name: e2e (${{ matrix.project }} ${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    # Real-time session and offline specs; each job runs one browser project and half its specs.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, webkit, Mobile Safari]
        shard: [1, 2]
        include:
          - project: chromium
            browser: chromium
          - project: webkit
            browser: webkit
          - project: Mobile Safari
            browser: webkit
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - uses: ./.github/actions/setup
      - run: pnpm --filter @clavis/web exec playwright install --with-deps ${{ matrix.browser }}
      - run: >-
          pnpm --filter @clavis/web exec playwright test
          --project="${{ matrix.project }}" --shard=${{ matrix.shard }}/2
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.browser }}-${{ strategy.job-index }}
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7

  # Aggregate jobs: branch protection requires these names.
  check:
    if: always()
    needs: [format, lint, typecheck, boundaries, test, build]
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo '${{ toJSON(needs) }}'
          [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "false" ]

  e2e:
    if: always()
    needs: [e2e-shard]
    runs-on: ubuntu-latest
    steps:
      - run: |
          [ "${{ needs.e2e-shard.result }}" = "success" ]
